name: composer update

on:
  workflow_call:
    inputs:
      php:
        default: 'latest'
        required: false
        type: string
      extensions:
        default: 'mbstring'
        required: false
        type: string
      composer-path:
        default: './'
        required: false
        type: string
      git-name:
        default: 'github-actions[bot]'
        required: false
        type: string
      git-email:
        default: '41898282+github-actions[bot]@users.noreply.github.com'
        required: false
        type: string
      branch:
        default: 'composer-update'
        required: false
        type: string
      title:
        default: 'composer update'
        required: false
        type: string
      commit-message:
        default: 'composer update'
        required: false
        type: string
    secrets:
      token:
        required: true

jobs:
  composer_update_job:
    name: composer update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php }}
          extensions: ${{ inputs.extensions }}
          coverage: none
      - name: Install Composer dependencies
        working-directory: ${{ inputs.composer-path }}
        run: composer install
      - name: Composer update
        id: composer
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const result = await exec.getExecOutput('composer', ['update', '--no-install', '--working-dir=${{ inputs.composer-path }}'], {
              ignoreReturnCode: true,
            })
            const output = result.stdout + result.stderr
            core.setOutput('output', output.match(/^.* - .*$/gm)?.map(str => str.trim()).join("\n"))
      - name: Composer output
        run: |
          echo "${{ steps.composer.outputs.output }}"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.token }}
          branch: ${{ inputs.branch }}
          commit-message: ${{ inputs.commit-message }}
          committer: ${{ inputs.git-name }} <${{ inputs.git-email }}>
          author: ${{ inputs.git-name }} <${{ inputs.git-email }}>
          title: ${{ inputs.title }}
          body: ${{ steps.composer.outputs.output }}
          add-paths: |
            *.lock
